    '<div class="row" style="margin-top:14px"><button class="btn-main" style="font-size:16px;padding:13px" data-act="breathe">Atemübung, 2 Minuten</button></div>'+
    '<p class="msg" style="margin-top:14px">Du hast dich vorbereitet. Lies jede Frage zweimal, teil dir die Zeit ein und fang mit dem an, was du sicher kannst.</p></div>'}
function examEveHTML(e){const d=exDate(e);return '<div class="card pday"><div class="eyebrow">Morgen ist Prüfung</div><div class="hname">'+esc(e.name)+'</div><div class="hdate">'+fmtEx(e)+(e.place?' · '+esc(e.place):'')+'</div><p class="msg" style="margin-top:10px">Heute Abend einpacken, Wecker stellen und keinen neuen Stoff mehr anfangen.</p>'+checklistHTML(e)+'<div class="row" style="margin-top:14px"><button data-act="breathe">Atemübung</button><button data-act="pdayPrev" data-e="'+e.id+'">Prüfungstag-Ansicht</button></div></div>'}
let breathT=null;
function breatheModal(){openModal('<h3 style="text-align:center">Ruhig atmen</h3><div class="breath"><div class="bcirc" id="bc"></div><div class="blbl" id="bl">Bereit</div></div><p class="hint" style="text-align:center" id="bn">4 Sekunden ein, 6 Sekunden aus. Langsames Ausatmen hilft vielen, ruhiger zu werden.</p><div class="row" style="margin-top:12px"><button class="btn-main" data-act="breathGo" style="font-size:16px">Start</button></div><div class="row" style="margin-top:6px"><button class="btn-ghost" data-act="breathStop">Schließen</button></div>')}
function breatheRun(){clearInterval(breathT);let t=0;const gb=document.querySelector('[data-act=breathGo]');if(gb)gb.textContent='Neu starten';const cycles=12;const bc=document.getElementById('bc'),bl=document.getElementById('bl'),bn=document.getElementById('bn');
  const step=()=>{const c=Math.floor(t/10),p=t%10;if(c>=cycles){clearInterval(breathT);bl.textContent='Geschafft';bc.className='bcirc';bn.textContent='Gut gemacht. Du bist bereit.';return}
    if(p===0){bc.className='bcirc in';bl.textContent='Einatmen'}if(p===4){bc.className='bcirc out';bl.textContent='Ausatmen'}bn.textContent='Runde '+(c+1)+' von '+cycles;t++};step();breathT=setInterval(step,1000)}

/* ===== 12 Lernduell ===== */
function b64e(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}
function myDuel(){const ws=weekStart(today());const w=weekStats(ws);return {v:1,n:S.profile.name||'Ich',w:ws,h:Math.round(w.ist),s:w.sprints,st:streak(),l:levelInfo().n}}
function myCode(){return 'ES1-'+b64e(myDuel())}
function duelCardHTML(){const me=myDuel();const ws=me.w;const fr=S.duel.friends;
  const cur=[Object.assign({me:true},me)].concat(fr.filter(f=>f.w===ws)).sort((a,b)=>b.h-a.h);const old=fr.filter(f=>f.w!==ws);const mx=Math.max(60,...cur.map(x=>x.h));
  let o='<div class="card"><div class="dayh" style="margin-bottom:6px"><b>Lernduell</b><span>Woche ab '+fmtDay(ws)+'</span></div>';
  if(!fr.length)o+='<p class="msg">Lernt gemeinsam, auch ohne Server: Teil deinen Code mit Freund:innen, sie fügen ihn in ihrer Endspurt-App ein und schicken dir ihren zurück. So seht ihr gegenseitig eure Wochenstunden.</p>';
  else{o+=cur.map((x,i)=>'<div class="duel'+(x.me?' me':'')+'" '+(x.me?'':'data-act="duelDel" data-n="'+esc(x.n)+'"')+'><span class="dpos">'+(i+1)+'</span><div style="flex:1;min-width:0"><div class="srow-t"><span><b>'+esc(x.me?x.n+' (du)':x.n)+'</b></span><span>'+fmtH(x.h)+'</span></div><div class="minibar" style="margin-top:5px"><i style="width:'+Math.round(x.h/mx*100)+'%"></i></div><small class="hint">'+x.s+' Sprints · Serie '+x.st+' · Level '+x.l+(x.at&&!x.me?' · Stand '+fmtDay(x.at):'')+'</small></div></div>').join('');
    const lead=cur[0];o+='<p class="hint" style="margin-top:10px">'+(cur.length<2?'Noch kein aktueller Code von dieser Woche. Bitte um einen neuen.':lead.me?'Du führst diese Woche! Bleib dran.':esc(lead.n)+' liegt vorne. Ein Sprint, und der Abstand schrumpft.')+'</p>';
    if(old.length)o+='<p class="hint">Älterer Stand: '+old.map(f=>esc(f.n)+' '+fmtH(f.h)+' (Woche ab '+fmtDay(f.w)+')').join(', ')+'</p>'}
  return o+'<div class="row" style="margin-top:12px"><button data-act="duelShare">Meinen Stand teilen</button><button data-act="duelPaste">Code einfügen</button></div></div>'}
function duelShareText(){const me=myDuel();return 'Mein Endspurt-Stand diese Woche: '+fmtH(me.h)+', '+me.s+' Sprints. Füg den Code in deiner Endspurt-App unter Ziel, Lernduell ein: '+myCode()}

/* ===== Aktionen ===== */
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;const id=+el.dataset.id;
  switch(a){
    case 'rwAdd':rwDraft={text:'',kind:'hours',val:10,examId:(openSorted()[0]||{}).id};rewardModal();break;
    case 'rwEdit':{const r=S.rewards.find(x=>x.id===id);if(r){rwDraft=Object.assign({},r);rewardModal()}break}
    case 'rwKind':rwReadDraft();rwDraft.kind=el.dataset.k;if(rwDraft.kind==='exam'&&!rwDraft.examId)rwDraft.examId=(openSorted()[0]||{}).id;rewardModal();break;
    case 'rwExam':rwReadDraft();rwDraft.examId=+el.dataset.e;rewardModal();break;
    case 'rwSave':{rwReadDraft();const d=rwDraft;if(!String(d.text).trim()){toast('Womit belohnst du dich?');break}if(d.kind!=='exam'&&!(+d.val>0)){toast('Bitte eine Zahl eintragen.');break}
      let r=d.id?S.rewards.find(x=>x.id===d.id):null;const base=d.kind==='hours'?istMin(()=>true)/60:d.kind==='sprints'?S.sessions.filter(x=>!x.manual).length:0;
      if(r){const changed=r.kind!==d.kind;Object.assign(r,{text:d.text.trim(),kind:d.kind,val:+d.val||1,examId:d.examId});if(changed){r.base=base;r.unlocked=null}}
      else S.rewards.push({id:S.nextId++,text:d.text.trim(),kind:d.kind,val:+d.val||1,examId:d.examId,base,created:today(),unlocked:null,redeemed:null});
      save();closeModal();render();checkRewards();break}
    case 'rwDel':S.rewards=S.rewards.filter(x=>x.id!==id);save();closeModal();render();break;
    case 'rwRedeem':{const r=S.rewards.find(x=>x.id===id);if(r){r.redeemed=today();S.wins.push({date:today(),text:'Belohnung gegönnt: '+r.text});save();toast('Viel Spaß damit!');render()}break}
    case 'dist':S.timer.dist=(S.timer.dist||0)+1;save();{const n=document.getElementById('distn');if(n)n.textContent=S.timer.dist}toast(rnd(['Bemerkt. Zurück zum Thema.','Gut erkannt. Weiter geht\'s.','Notiert. Ein Atemzug, dann weiter.']));break;
    case 'kdist':S.kl.dist=(S.kl.dist||0)+1;save();{const n=document.getElementById('kdistn');if(n)n.textContent=S.kl.dist}toast('Notiert. Zurück zur Klausur.');break;
    case 'sound':{const v=el.dataset.s;S.cfg.sound=v;save();if(v==='off'){soundStop();clearTimeout(sndPrev)}else if(soundShouldPlay())soundStart();else{soundStart(v);clearTimeout(sndPrev);sndPrev=setTimeout(()=>{if(!soundShouldPlay())soundStop()},3500)}render();break}
    case 'dlAdd':deadlineModal(null);break;
    case 'dlEdit':{const d=S.deadlines.find(x=>x.id===id);if(d)deadlineModal(d);break}
    case 'dlKind':case 'dlExam':{const was=el.classList.contains('on');document.querySelectorAll('[data-act='+a+']').forEach(b=>b.classList.remove('on'));if(!(a==='dlExam'&&was))el.classList.add('on');break}
    case 'dlSave':{const t=(document.getElementById('dlT').value||'').trim();const dt=document.getElementById('dlD').value;if(!t||!dt){toast('Bitte Titel und Datum eintragen.');break}
      const k=document.querySelector('[data-act=dlKind].on'),ex=document.querySelector('[data-act=dlExam].on');const v={title:t,date:dt,time:document.getElementById('dlH').value||'',kind:k?k.dataset.k:'Sonstiges',examId:ex?+ex.dataset.e:null};
      if(el.dataset.id){Object.assign(S.deadlines.find(x=>x.id===+el.dataset.id),v)}else S.deadlines.push(Object.assign({id:S.nextId++,done:false},v));save();closeModal();render();break}
    case 'dlDel':S.deadlines=S.deadlines.filter(x=>x.id!==id);save();closeModal();render();break;
    case 'dlDone':{const d=S.deadlines.find(x=>x.id===id);if(d){d.done=!d.done;save();if(d.done)toast('Erledigt. Eine Sorge weniger.');render()}break}
    case 'chkAdd':{const e=S.exams.find(x=>x.id===+el.dataset.e);const i=document.getElementById('chkNew');if(e&&i&&i.value.trim()){e.check=exChecklist(e);e.check.push({t:i.value.trim(),d:false});save();render()}break}
    case 'chkDel':{const e=S.exams.find(x=>x.id===+el.dataset.e);if(e){e.check=exChecklist(e);e.check.splice(+el.dataset.i,1);save();render()}ev.preventDefault();break}
    case 'breathe':breatheModal();break;
    case 'breathGo':breatheRun();break;
    case 'breathStop':clearInterval(breathT);closeModal();break;
    case 'pdayPrev':S.activeId=+el.dataset.e||S.activeId;save();go('pday');break;
    case 'duelShare':{const t=duelShareText();const done=()=>toast('Kopiert. Schick es per WhatsApp oder Nachricht.');
      if(navigator.share&&window.self===window.top){navigator.share({text:t}).catch(()=>{})}else{try{navigator.clipboard.writeText(t).then(done,()=>openModal('<h3>Dein Code</h3><textarea rows="5" readonly>'+esc(t)+'</textarea><div class="row" style="margin-top:12px"><button class="btn-ghost" data-act="close">Schließen</button></div>'))}catch(e){openModal('<h3>Dein Code</h3><textarea rows="5" readonly>'+esc(t)+'</textarea><div class="row" style="margin-top:12px"><button class="btn-ghost" data-act="close">Schließen</button></div>')}}break}
    case 'duelPaste':openModal('<h3>Code einfügen</h3><p>Füg die Nachricht oder den Code ein, den du bekommen hast.</p><textarea id="duIn" rows="4" placeholder="ES1-…"></textarea>'+btnRow('Übernehmen','duelSave'));break;
    case 'duelSave':{const m=/ES1-[A-Za-z0-9_-]+/.exec(document.getElementById('duIn').value||'');if(!m){toast('Kein gültiger Code gefunden.');break}
      try{const d=b64d(m[0].slice(4));if(!d||!d.n||!d.w)throw 0;if(d.n===(S.profile.name||'Ich')&&d.h===myDuel().h){toast('Das ist dein eigener Code.');break}
        const f=S.duel.friends.filter(x=>x.n.toLowerCase()!==String(d.n).toLowerCase());f.push({n:String(d.n).slice(0,30),w:d.w,h:+d.h||0,s:+d.s||0,st:+d.st||0,l:+d.l||1,at:today()});S.duel.friends=f;save();closeModal();toast(d.n+' ist dabei!');render()}catch(e){toast('Der Code ist beschädigt.')}break}
    case 'duelDel':openModal('<h3>'+esc(el.dataset.n)+' entfernen?</h3><p>Der Stand wird aus deinem Lernduell gelöscht.</p>'+btnRow('Entfernen','duelDelOk" data-n="'+esc(el.dataset.n)));break;
    case 'duelDelOk':S.duel.friends=S.duel.friends.filter(x=>x.n!==el.dataset.n);save();closeModal();render();break;
  }});
document.addEventListener('change',ev=>{const el=ev.target;
  if(el.dataset.chk!=null){const e=S.exams.find(x=>x.id===+el.dataset.e);if(e){e.check=exChecklist(e);e.check[+el.dataset.chk].d=el.checked;save();render();if(e.check.every(x=>x.d))toast('Alles eingepackt!')}}
  if(el.dataset.cfg==='vol')soundVol(pnum(el.value));});
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset.cfg==='vol')soundVol(pnum(el.value))});

/* ===== Einführung ===== */
const TOUR=[
 ['heute','Heute','Hier startest du jeden Tag: Countdown zur nächsten Prüfung, dein Tagessoll und der große Start-Knopf. Mit einem Tipp auf die Energie bekommst du einen passenden Vorschlag.'],
 ['timer','Sprint','Der Timer für deine Lernsprints. Oben wechselst du in den Klausurmodus für Probeklausuren. Dazu Fokus-Geräusche und der Knopf „Abgelenkt“.'],
 ['plan','Plan','Deine Prüfung, die Themen bis zum Termin, die Fehlerliste und der Lernkalender. Mit „bearbeiten“ änderst du alle Angaben.'],
 ['ziel','Ziel','Drei Bereiche: Weg mit Zeitstrahl und Fristen, Zahlen mit deiner Statistik, Erfolge mit Level, Abzeichen, Belohnungen und Lernduell.'],
 ['gear','Einstellungen','Über das Zahnrad änderst du alles: Profil, Fächer, Lernkalender, eigene Sprüche, Timer und welche Karten unter „Heute“ erscheinen.']];
let tourStep=-1;
function startTour(){tourStep=0;showTour()}
function showTour(){let c=document.getElementById('coach');if(!c){c=document.createElement('div');c.id='coach';document.body.appendChild(c)}
  document.querySelectorAll('.tourhi').forEach(x=>x.classList.remove('tourhi'));
  if(tourStep<0||tourStep>=TOUR.length){c.remove();document.body.classList.remove('touring');tourStep=-1;S.tourDone=true;save();go('heute');setTimeout(checkBadges,400);return}
  const t=TOUR[tourStep];document.body.classList.add('touring');
  if(t[0]!=='gear'){if(tab!==t[0])go(t[0]);const b=document.querySelector('nav button[data-tab='+t[0]+']');if(b)b.classList.add('tourhi')}
  else{go('heute');setTimeout(()=>{const g=document.querySelector('.gear');if(g)g.classList.add('tourhi')},30)}
  c.innerHTML='<div class="coachcard'+(t[0]==='gear'?' low':'')+'"><div class="eyebrow">'+(tourStep+1)+' von '+TOUR.length+'</div><h3>'+t[1]+'</h3><p>'+t[2]+'</p><div class="dots">'+TOUR.map((_,i)=>'<i class="'+(i===tourStep?'on':'')+'"></i>').join('')+'</div><div class="row"><button class="btn-ghost" data-act="tourEnd">Überspringen</button><button class="btn-main" data-act="tourNext" style="font-size:16px;padding:12px">'+(tourStep===TOUR.length-1?'Los geht\'s':'Weiter')+'</button></div></div>'}

/* ===== Startseite anpassen ===== */
function homeSetupHTML(){return '<p class="hint" style="margin-top:0">Wähle, welche Karten unter „Heute“ erscheinen. Countdown und Start-Knopf bleiben immer.</p>'+HOME_CARDS.map(x=>'<label class="toggle"><input type="checkbox" data-home="'+x[0]+'" '+(homeOn(x[0])?'checked':'')+'><span>'+x[1]+'</span></label>').join('')+'<div class="row" style="margin-top:14px"><button data-act="tourStart">Einführung nochmal ansehen</button></div>'}

document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  switch(a){
    case 'tourNext':tourStep++;showTour();break;
    case 'tourEnd':tourStep=-1;showTour();break;
    case 'tourStart':startTour();break;
    case 'antrieb':antriebOpen=!antriebOpen;if(antriebOpen&&!S.why)editWhy=true;render();break;
    case 'gotoErfolge':zielTab='erfolge';go('ziel');break;
    case 'ztab':zielTab=el.dataset.t;render();break;
    case 'examEdit':{const e=active();if(e)openModal('<h3>Prüfung bearbeiten</h3>'+examFormHTML(e));break}
    case 'topAddOpen':openModal('<h3>Themen hinzufügen</h3><p>Ein Kapitel oder Stoffgebiet pro Zeile, so wie es in deinen Unterlagen steht. Die App verteilt alles vom Lernbeginn bis zur Prüfung und hält den letzten Tag für Wiederholung frei.</p><textarea id="topIn" rows="7" placeholder="Kapitel 1\nKapitel 2\nKapitel 3"></textarea>'+btnRow('Hinzufügen und verteilen','addTop'));break;
    case 'calMore':calMore=!calMore;render();break;
    case 'nextQuote':quoteOff++;render();break;
    case 'welcomeSeen':if(S.welcome){S.welcome.seen=true;save();confetti();render()}break;
    case 'welcomeAgain':if(S.welcome){S.welcome.seen=false;save();go('heute')}break;
    case 'errAll':errAll=!errAll;render();break;
  }});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.home){S.cfg.home=Object.assign({},S.cfg.home||{});S.cfg.home[el.dataset.home]=el.checked;save();render()}});

let lastDay=today(),heroMin=Math.floor(Date.now()/60000);
setInterval(()=>{if(S.timer.endAt&&tLeft()<=0){finish();return}
  if(S.kl.endAt){if(klLeft()<=0){klFinish();return}const i=klPhase();if(i>S.kl.ph){S.kl.ph=i;save();chime();toast('Phase: '+phases(S.kl.dur)[i].n);if(tab==='timer')render()}}
  if(tab==='timer'){updTimer();updKl()}const mk=Math.floor(Date.now()/60000);if(mk!==heroMin){heroMin=mk;const cd=document.getElementById('cd');if(cd&&!modalOpen())cd.innerHTML=heroHTML();if(document.getElementById('pdcd')&&!modalOpen()&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)))render()}
  if(today()!==lastDay){lastDay=today();render()}},500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(S.kl.endAt&&klLeft()<=0)klFinish();else if(S.timer.endAt&&tLeft()<=0)finish();else if(!modalOpen()&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)))render()}});
if(S.kl.endAt&&klLeft()<=0)klFinish();else if(S.timer.endAt&&tLeft()<=0)finish();else render();
setTimeout(()=>{if(S.onboarded&&!S.tourDone)startTour();else checkBadges()},800);
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}

})();
</script>
